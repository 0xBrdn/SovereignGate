[package]
name = "sovereigngate"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Automated GDPR (EU) and nDSG/nLPD (Switzerland) compliance scanner for code, dependencies, and IaC."
license = "AGPL-3.0-only"

[lib]
name = "sovereigngate"
path = "src/lib.rs"

[[bin]]
name = "sovereigngate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ignore = "0.4"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tree-sitter = "0.24"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3