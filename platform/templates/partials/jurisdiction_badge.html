{% if jurisdiction == "US" %}
  <span class="inline-flex items-center px-2 py-0.5 text-[11px] font-mono-code font-medium bg-zinc-900 text-zinc-50 border border-zinc-900 rounded-sm">
    US · DPF/SCC
  </span>
{% elif jurisdiction == "CN" %}
  <span class="inline-flex items-center px-2 py-0.5 text-[11px] font-mono-code font-semibold bg-red-950 text-red-200 border border-red-800 rounded-sm">
    CN · NON-ADEQUATE
  </span>
{% elif jurisdiction == "NON_ADEQUATE" %}
  <span class="inline-flex items-center px-2 py-0.5 text-[11px] font-mono-code font-semibold bg-amber-950 text-amber-200 border border-amber-800 rounded-sm">
    3RD COUNTRY
  </span>
{% elif jurisdiction == "CH" %}
  <span class="inline-flex items-center px-2 py-0.5 text-[11px] font-mono-code font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-sm">
    CH · ADEQUATE
  </span>
{% else %}
  <span class="inline-flex items-center px-2 py-0.5 text-[11px] font-mono-code font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-sm">
    EU/EEA · ADEQUATE
  </span>
{% endif %}
